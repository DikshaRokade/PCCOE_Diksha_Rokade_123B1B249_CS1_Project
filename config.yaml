# AUTOSAR HLD Document Analysis Assistant - single source of truth for model / pipeline settings
project: default
paths:
  data_dir: Code/data            # chroma/, kb/, hld.sqlite, uploads/ (override with env HLD_DATA_DIR)
  prompts_dir: Model_Prompts_Config/prompts
embedding:
  provider: auto                 # auto | bge | hash   (auto = BGE if loadable, else offline hash fallback)
  model: BAAI/bge-small-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  hash_dim: 1024
vector_store:
  backend: chromadb
  distance: cosine
retrieval:
  mode: hybrid                   # hybrid | dense | bm25
  top_k: 6
  candidate_k: 20
  rrf_k: 60
  min_query_coverage: 0.6        # relevance gate: share of query content terms found in the evidence
chunking:
  max_chars: 900
  overlap_sentences: 1
llm:
  provider: auto                 # auto | ollama | extractive
  model: qwen2.5:7b-instruct     # any local Ollama model, e.g. llama3.2:3b for low-RAM laptops
  host: http://localhost:11434
  temperature: 0.0
  num_ctx: 4096
  timeout_s: 120
generation:
  max_context_sources: 6
  extractive_max_sentences: 4
upload:
  max_mb: 50
auth:
  enabled: true                  # development keys - replace before any shared deployment
  keys:
    dev-engineer-key: {user: diksha, role: engineer}
    dev-viewer-key: {user: viewer, role: viewer}
